<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI面接練習レコーダー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; overflow-x: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
    .animate-fall { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useRef, useEffect } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '2rem', color: '#ffaaaa', textAlign: 'center' }}>
              <h2 style={{ fontSize: '1.5rem', marginBottom: '1rem' }}>アプリの読み込みに失敗しました</h2>
              <p style={{ background: 'rgba(0,0,0,0.5)', padding: '1rem', borderRadius: '8px' }}>
                {this.state.error.toString()}
              </p>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const Icon = ({ name, size = 24, className = '', fill }) => (
      <span 
        className={`material-symbols-outlined ${className}`} 
        style={{ fontSize: size, color: fill === 'currentColor' ? 'inherit' : fill }}
      >
        {name}
      </span>
    );

    const Mic2 = (p) => <Icon name="mic" {...p}/>;
    const User = (p) => <Icon name="person" {...p}/>;
    const Award = (p) => <Icon name="emoji_events" {...p}/>;
    const FileText = (p) => <Icon name="description" {...p}/>;
    const Activity = (p) => <Icon name="graphic_eq" {...p}/>;
    const ChevronRight = (p) => <Icon name="chevron_right" {...p}/>;
    const Circle = (p) => <Icon name="circle" {...p}/>;
    const Square = (p) => <Icon name="stop" {...p}/>;
    const Trash2 = (p) => <Icon name="delete" {...p}/>;
    const Pause = (p) => <Icon name="pause" {...p}/>;
    const Play = (p) => <Icon name="play_arrow" {...p}/>;
    const Download = (p) => <Icon name="download" {...p}/>;
    const Loader2 = (p) => <Icon name="autorenew" className={`animate-spin ${p.className||''}`} {...p}/>;
    const Sparkles = (p) => <Icon name="auto_awesome" {...p}/>;
    const CheckCircle = (p) => <Icon name="check_circle" {...p}/>;

    function VoiceRecorder() {
      const [micGranted, setMicGranted] = useState(false);
      const [className, setClassName] = useState('');
      const [userName, setUserName] = useState('');
      const [isSetupComplete, setIsSetupComplete] = useState(false);

      const [isRecording, setIsRecording] = useState(false);
      const [audioBlob, setAudioBlob] = useState(null);
      const [audioUrl, setAudioUrl] = useState(null);
      const [mimeType, setMimeType] = useState('');
      const [isPlaying, setIsPlaying] = useState(false);
      const [displayStatus, setDisplayStatus] = useState('idle');
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);

      const [history, setHistory] = useState([]);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [displayAiResult, setDisplayAiResult] = useState(null);
      const [isHistoryView, setIsHistoryView] = useState(false);
      const [historyViewId, setHistoryViewId] = useState(null);
      const [reportView, setReportView] = useState('summary');

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const audioRef = useRef(new Audio());

      const currentChallengeNum = history.length + 1;

      const requestMicAccess = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
          setMicGranted(true);
        } catch (err) {
          alert("マイクのアクセスが拒否されました。設定から許可してください。");
        }
      };

      const handleSetupSubmit = (e) => {
        e.preventDefault();
        if (className.trim() && userName.trim()) {
          setIsSetupComplete(true);
        }
      };

      useEffect(() => {
        const audio = audioRef.current;
        const updateTime = () => setCurrentTime(audio.currentTime);
        const updateDuration = () => setDuration(audio.duration);
        const handleEnded = () => {
          setIsPlaying(false);
          setDisplayStatus('recorded');
          setCurrentTime(0);
        };

        audio.addEventListener('timeupdate', updateTime);
        audio.addEventListener('loadedmetadata', updateDuration);
        audio.addEventListener('ended', handleEnded);

        return () => {
          audio.removeEventListener('timeupdate', updateTime);
          audio.removeEventListener('loadedmetadata', updateDuration);
          audio.removeEventListener('ended', handleEnded);
          audio.pause();
        };
      }, []);

      const togglePlay = () => {
        if (!audioUrl) return;
        const audio = audioRef.current;
        
        if (isPlaying) {
          audio.pause();
          setIsPlaying(false);
          setDisplayStatus('paused');
        } else {
          if (audio.src !== audioUrl) {
            audio.src = audioUrl;
          }
          audio.play().catch(e => console.error("Playback failed:", e));
          setIsPlaying(true);
          setDisplayStatus('playing');
        }
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];
          setMimeType(mediaRecorder.mimeType);

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunksRef.current.push(event.data);
            }
          };

          mediaRecorder.onstop = () => {
            const actualMimeType = mediaRecorder.mimeType || 'audio/webm';
            const blob = new Blob(audioChunksRef.current, { type: actualMimeType });
            const url = URL.createObjectURL(blob);
            setAudioBlob(blob);
            setAudioUrl(url);
            setDisplayStatus('recorded');
          };

          mediaRecorder.start();
          setIsRecording(true);
          setDisplayStatus('recording');
        } catch (error) {
          console.error('Error accessing microphone:', error);
          alert('マイクにアクセスできませんでした。');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
        }
      };

      const resetRecording = () => {
        if (audioUrl) {
          URL.revokeObjectURL(audioUrl);
        }
        setAudioBlob(null);
        setAudioUrl(null);
        setDisplayStatus('idle');
        setIsPlaying(false);
        setCurrentTime(0);
        setDisplayAiResult(null);
        audioRef.current.src = "";
      };

      const downloadAudio = () => {
        if (!audioBlob) return;
        const fileName = `${className}_${userName}_${currentChallengeNum}回目.mp3`;
        const a = document.createElement('a');
        a.href = audioUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      const handleAiCheck = async () => {
        setIsAnalyzing(true);
        
        try {
          const blobToBase64 = (blob) => {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
          };
          
          const base64Audio = await blobToBase64(audioBlob);
          const audioMimeType = audioBlob.type || 'audio/webm';

          const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSy4KxkYVQwhw1aUWeUGPqNb2DQVJowUIOP-QXW745n1xvUy61Jbi3aks5-G555Gsn/exec";
          
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain',
            },
            body: JSON.stringify({
              audioData: base64Audio,
              mimeType: audioMimeType
            })
          });
          
          const result = await response.json();

          if (result.error) {
  throw new Error("サーバーエラー: " + JSON.stringify(result.error));
}

          let parsedData;
          if (result.candidates && result.candidates.length > 0 &&
              result.candidates[0].content && result.candidates[0].content.parts &&
              result.candidates[0].content.parts.length > 0) {
            
            const jsonText = result.candidates[0].content.parts[0].text;
            
            const cleanedJsonText = jsonText
              .split('\x60\x60\x60json').join('')
              .split('\x60\x60\x60').join('')
              .trim();
              
            parsedData = JSON.parse(cleanedJsonText);
          } else {
            throw new Error("AIからの応答が不正です");
          }

          let finalScore = parsedData.score;
          if (currentChallengeNum >= 10 && Math.random() > 0.6) {
            finalScore = 100;
          } else if (currentChallengeNum >= 5 && Math.random() > 0.4) {
            finalScore = Math.max(finalScore, Math.floor(Math.random() * 5) + 95); 
          }
          parsedData.score = finalScore;
            
          const newId = Date.now().toString();
          const newHistoryItem = {
            id: newId,
            challengeNum: currentChallengeNum,
            url: audioUrl,
            blob: audioBlob,
            aiResult: parsedData,
            date: new Date().toLocaleString()
          };
          
          setHistory(prev => [newHistoryItem, ...prev].slice(0, 20));
          setDisplayAiResult(parsedData);
          setReportView('summary');
          setIsHistoryView(true);
          setHistoryViewId(newId);

        } catch (error) {
          console.error("AI分析エラー:", error);
          alert("AI分析に失敗しました。もう一度お試しください。\n" + error.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const prepareNextChallenge = () => {
        setIsHistoryView(false);
        setHistoryViewId(null);
        setAudioBlob(null);
        setAudioUrl(null);
        setDisplayAiResult(null);
        setDisplayStatus('idle');
        audioRef.current.src = "";
      };

      const viewHistoryItem = (item) => {
        setIsHistoryView(true);
        setHistoryViewId(item.id);
        setAudioUrl(item.url);
        setDisplayAiResult(item.aiResult);
        setDisplayStatus('recorded');
        setIsPlaying(false);
        setReportView('summary');
        audioRef.current.src = item.url;
      };

      if (!micGranted) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-white/10">
              <div className="w-24 h-24 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <Mic2 className="text-blue-400" size={48} />
              </div>
              <h2 className="text-2xl font-bold text-white mb-4">マイクの準備</h2>
              <p className="text-slate-400 mb-8 text-sm">
                音声を録音し、AIが採点するためにマイクへのアクセスが必要です。
              </p>
              <button
                onClick={requestMicAccess}
                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)]"
              >
                マイクを許可してはじめる
              </button>
            </div>
          </div>
        );
      }

      if (!isSetupComplete) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-md w-full border border-white/10">
              <h2 className="text-2xl font-bold text-white mb-6 text-center">プロフィール入力</h2>
              <form onSubmit={handleSetupSubmit} className="space-y-6">
                <div>
                  <label className="block text-sm font-medium text-slate-400 mb-2">クラス・学年</label>
                  <input
                    type="text"
                    required
                    placeholder="例: 3年B組"
                    value={className}
                    onChange={(e) => setClassName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-400 mb-2">氏名</label>
                  <input
                    type="text"
                    required
                    placeholder="例: 山田 太郎"
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)]"
                >
                  スタート！
                </button>
              </form>
            </div>
          </div>
        );
      }

      const isGold = displayAiResult && displayAiResult.score >= 95;
      const isRainbow = displayAiResult && displayAiResult.score === 100;
      
      const bgClass = isRainbow 
        ? "bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-gradient-to-br from-purple-900 via-pink-800 to-yellow-900" 
        : isGold 
          ? "bg-gradient-to-br from-amber-900 via-yellow-800 to-orange-900" 
          : "bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900";

      return (
        <div className={`min-h-screen flex text-slate-200 font-sans transition-colors duration-1000 ${bgClass} overflow-hidden relative`}>
          
          {isRainbow && (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-0">
              {[...Array(50)].map((_, i) => (
                <div 
                  key={i} 
                  className="absolute animate-fall"
                  style={{
                    left: `${Math.random() * 100}%`,
                    top: `-10%`,
                    width: `${Math.random() * 10 + 5}px`,
                    height: `${Math.random() * 10 + 5}px`,
                    backgroundColor: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'][Math.floor(Math.random() * 6)],
                    animationDuration: `${Math.random() * 3 + 2}s`,
                    animationDelay: `${Math.random() * 2}s`,
                    transform: `rotate(${Math.random() * 360}deg)`
                  }}
                />
              ))}
            </div>
          )}

          <div className="w-48 lg:w-56 bg-black/60 backdrop-blur-3xl border-r border-white/10 flex flex-col z-20 shadow-2xl shrink-0">
            <div className="p-4 border-b border-white/10 flex flex-col items-center justify-center bg-white/5">
              <div className="w-10 h-10 bg-indigo-500/20 rounded-full flex items-center justify-center mb-2">
                <User className="text-indigo-400" size={20} />
              </div>
              <p className="text-sm font-medium text-white truncate w-full text-center">{userName}</p>
              <p className="text-xs text-white/50 truncate w-full text-center">{className}</p>
            </div>
            
            <div className="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
              <p className="text-[10px] font-bold text-white/40 uppercase tracking-wider pl-2 mb-2 mt-2">録音履歴</p>
              
              {history.length === 0 && (
                 <div className="text-center p-4 text-white/30 text-xs">
                   履歴なし
                 </div>
              )}

              {history.map((item) => (
                <button
                  key={item.id}
                  onClick={() => viewHistoryItem(item)}
                  className={`w-full text-left py-1.5 px-2 rounded-lg transition-all border flex items-center gap-2 ${
                    historyViewId === item.id 
                    ? 'bg-blue-500/20 border-blue-500/50 text-white shadow-md' 
                    : 'bg-white/5 border-transparent hover:bg-white/10 text-white/70'
                  }`}
                >
                  <div className={`w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${item.aiResult && item.aiResult.score >= 90 ? 'bg-yellow-500/20 text-yellow-400' : 'bg-white/10'}`}>
                    {item.aiResult && item.aiResult.score >= 90 ? <Award size={10} /> : <FileText size={10} />}
                  </div>
                  <div className="flex-1 min-w-0 flex justify-between items-center gap-1">
                    <p className="text-[11px] font-bold truncate">第{item.challengeNum}回</p>
                    <p className="text-[11px] font-mono font-bold opacity-80">{item.aiResult ? `${item.aiResult.score}点` : '-'}</p>
                  </div>
                </button>
              ))}
            </div>
          </div>

          <div className="flex-1 p-4 lg:p-6 relative z-10 flex flex-col lg:flex-row gap-6 overflow-hidden">
            
            <div className={`bg-black/40 backdrop-blur-xl border border-white/10 rounded-[2rem] shadow-2xl flex flex-col relative overflow-hidden transition-all duration-500 ${(!displayAiResult && !isAnalyzing) ? 'w-full max-w-3xl mx-auto flex-1' : 'w-full lg:w-1/2 flex-none'}`}>
              
              <div className="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                <div className="text-sm font-bold tracking-widest text-white/60 flex items-center gap-2">
                  <Activity className={isRecording ? "text-red-500 animate-pulse" : ""} size={16} />
                  {isHistoryView ? `第${history.find(h => h.id === historyViewId) ? history.find(h => h.id === historyViewId).challengeNum : ''}回目の記録` : 'RECORDER'}
                </div>
                {(displayAiResult || isHistoryView) && (
                  <button 
                    onClick={prepareNextChallenge}
                    className="text-sm bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 px-5 py-2 rounded-full transition-all shadow-[0_0_15px_rgba(59,130,246,0.5)] flex items-center gap-2 font-bold text-white transform hover:scale-105 border border-blue-400/30"
                  >
                    次の録音 <ChevronRight size={16} />
                  </button>
                )}
              </div>

              <div className="flex-1 flex flex-col items-center justify-center p-6 lg:p-8">
                
                {!isHistoryView && (
                  <div className="mb-8 text-center animate-fade-in-up">
                    <span className="inline-block px-5 py-2 bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-200 rounded-full text-sm font-bold tracking-wider mb-2 border border-blue-500/30 shadow-inner">
                      第 {currentChallengeNum} 回目のチャレンジ！
                    </span>
                  </div>
                )}

                <div className="font-mono text-5xl lg:text-7xl font-light tracking-tighter text-white/90 drop-shadow-md mb-10 text-center">
                  {String(Math.floor(currentTime / 60)).padStart(2, '0')}:
                  {String(Math.floor(currentTime % 60)).padStart(2, '0')}
                  <span className="text-2xl lg:text-3xl text-white/40 ml-2">
                    .{String(Math.floor((currentTime % 1) * 100)).padStart(2, '0')}
                  </span>
                </div>

                <div className="flex justify-center items-end gap-4 lg:gap-8 w-full max-w-lg mx-auto">
                  
                  {!isHistoryView && (displayStatus === 'idle' || displayStatus === 'recording') && (
                    <div className="flex flex-col items-center gap-3">
                      {displayStatus === 'idle' ? (
                        <>
                          <button
                            onClick={startRecording}
                            className="w-28 h-28 lg:w-32 lg:h-32 rounded-full bg-red-500 hover:bg-red-400 flex items-center justify-center text-white shadow-[0_0_40px_rgba(239,68,68,0.5)] transition-all transform hover:scale-105 active:scale-95 border-4 border-red-300"
                          >
                            <Circle fill="currentColor" size={40} />
                          </button>
                          <span className="text-sm font-bold text-red-400 tracking-wide">録音スタート</span>
                        </>
                      ) : (
                        <>
                          <button
                            onClick={stopRecording}
                            className="w-28 h-28 lg:w-32 lg:h-32 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-white shadow-xl transition-all transform hover:scale-105 active:scale-95 border-4 border-slate-400"
                          >
                            <Square fill="currentColor" size={32} />
                          </button>
                          <span className="text-sm font-bold text-white/80 tracking-wide">ストップ</span>
                        </>
                      )}
                    </div>
                  )}

                  {((!isHistoryView && (displayStatus === 'recorded' || displayStatus === 'playing' || displayStatus === 'paused')) || isHistoryView) && (
                    <div className="flex items-end gap-4 lg:gap-8">
                      {!isHistoryView && (
                        <div className="flex flex-col items-center gap-2">
                          <button
                            onClick={resetRecording}
                            className="w-14 h-14 rounded-full bg-white/10 hover:bg-red-500/20 border border-white/20 hover:border-red-500/50 flex items-center justify-center text-white/80 hover:text-red-400 transition-all"
                            title="やり直す"
                          >
                            <Trash2 size={20} />
                          </button>
                          <span className="text-xs font-medium text-white/60">やり直す</span>
                        </div>
                      )}
                      
                      <div className="flex flex-col items-center gap-3">
                        <button
                          onClick={togglePlay}
                          className="w-24 h-24 lg:w-28 lg:h-28 rounded-full bg-emerald-500 hover:bg-emerald-400 flex items-center justify-center text-white shadow-[0_0_30px_rgba(16,185,129,0.4)] transition-all transform hover:scale-105 active:scale-95 border-4 border-emerald-300"
                        >
                          {isPlaying ? <Pause fill="currentColor" size={32} /> : <Play className="ml-2" fill="currentColor" size={32} />}
                        </button>
                        <span className="text-sm font-bold text-emerald-400 tracking-wide">{isPlaying ? '一時停止' : '再生スタート'}</span>
                      </div>

                      <div className="flex flex-col items-center gap-2">
                        <button
                          onClick={downloadAudio}
                          className="w-14 h-14 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white/90 hover:text-white transition-all"
                        >
                          <Download size={20} />
                        </button>
                        <span className="text-[10px] lg:text-xs font-medium text-white/60 whitespace-nowrap">保存</span>
                      </div>

                      {!isHistoryView && !displayAiResult && (
                        <div className="flex flex-col items-center gap-2 animate-fade-in ml-2 pl-4 lg:pl-6 border-l border-white/10">
                          <button
                            onClick={handleAiCheck}
                            disabled={isAnalyzing}
                            className="w-16 h-16 lg:w-20 lg:h-20 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 border-2 border-white/30 flex items-center justify-center text-white transition-all shadow-[0_0_20px_rgba(168,85,247,0.5)] disabled:opacity-50 hover:scale-105"
                          >
                            {isAnalyzing ? <Loader2 className="animate-spin" size={28} /> : <Sparkles size={28} />}
                          </button>
                          <span className="text-xs lg:text-sm font-bold text-purple-300 whitespace-nowrap">{isAnalyzing ? '分析中...' : 'AI採点'}</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {(isAnalyzing || displayAiResult) && (
              <div className="w-full lg:w-1/2 flex-none bg-black/40 backdrop-blur-2xl border border-white/10 rounded-[2rem] p-4 lg:p-6 flex flex-col relative overflow-hidden transition-all duration-500 animate-fade-in">
                
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-3 text-white">
                    <Sparkles className={isAnalyzing ? "animate-spin text-purple-400" : "text-yellow-400"} />
                    <h2 className="text-lg font-bold tracking-wide">AI 面接コーチング</h2>
                  </div>
                  
                  {!isAnalyzing && displayAiResult && (
                    <div className="flex bg-white/10 rounded-lg p-1">
                      <button 
                        onClick={() => setReportView('summary')}
                        className={`px-3 py-1 rounded-md text-sm font-medium transition-all ${reportView === 'summary' ? 'bg-white/20 text-white shadow-sm' : 'text-white/50 hover:text-white/80'}`}
                      >
                        スコア
                      </button>
                      <button 
                        onClick={() => setReportView('transcript')}
                        className={`px-3 py-1 rounded-md text-sm font-medium transition-all ${reportView === 'transcript' ? 'bg-white/20 text-white shadow-sm' : 'text-white/50 hover:text-white/80'}`}
                      >
                        全文表示
                      </button>
                    </div>
                  )}
                </div>

                {isAnalyzing ? (
                  <div className="flex-1 flex flex-col items-center justify-center min-h-[300px]">
                    <div className="w-20 h-20 border-4 border-white/10 border-t-purple-500 rounded-full animate-spin mb-6"></div>
                    <p className="text-lg text-white/70 animate-pulse">音声を分析しています...</p>
                    <p className="text-sm text-white/40 mt-2">滑舌やスピード、声のトーンを確認中</p>
                  </div>
                ) : displayAiResult && (
                  <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar animate-fade-in flex flex-col">
                    
                    {reportView === 'summary' ? (
                      <div className="space-y-4">
                        <div className="bg-white/5 rounded-3xl p-5 border border-white/10 relative overflow-hidden flex flex-col items-center gap-4">
                          {displayAiResult.score >= 90 && (
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-yellow-500/20 rounded-full blur-2xl"></div>
                          )}
                          
                          {displayAiResult.score >= 90 && (
                            <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-yellow-500/20 border border-yellow-500/30 text-yellow-300 rounded-full text-xs font-bold z-10">
                              <CheckCircle size={14} /> 素晴らしい！
                            </div>
                          )}

                          <div className="relative z-10 flex flex-col items-center">
                            <svg className="w-28 h-28 transform -rotate-90">
                              <circle cx="56" cy="56" r="48" stroke="currentColor" strokeWidth="8" fill="transparent" className="text-white/10" />
                              <circle cx="56" cy="56" r="48" stroke="currentColor" strokeWidth="8" fill="transparent" 
                                className={displayAiResult.score >= 90 ? "text-yellow-400" : displayAiResult.score >= 70 ? "text-green-400" : "text-blue-400"}
                                strokeDasharray={301.6} 
                                strokeDashoffset={301.6 - (301.6 * displayAiResult.score) / 100} 
                                strokeLinecap="round" 
                                style={{ transition: 'stroke-dashoffset 1.5s ease-out' }}
                              />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center">
                              <span className="text-3xl font-black text-white drop-shadow-md">{displayAiResult.score}</span>
                              <span className="text-[10px] text-white/60">/ 100</span>
                            </div>
                          </div>

                          <div className="w-full relative z-10 text-center flex flex-col items-center mt-2">
                            <h3 className="text-xs font-bold tracking-wider text-white/60 mb-2 border-b border-white/10 pb-1 px-4">総合評価</h3>
                            <p className="text-sm text-white/90 leading-relaxed text-left w-full max-w-sm">{displayAiResult.feedback}</p>
                          </div>
                        </div>

                        <div className="bg-white/5 rounded-3xl p-5 border border-white/10">
                          <h3 className="text-xs font-bold text-white/60 mb-3 tracking-wider">詳細スコア</h3>
                          <div className="space-y-3">
                            {displayAiResult.radar.map((item, idx) => (
                              <div key={idx} className="flex items-center gap-3">
                                <span className="w-14 text-xs font-medium text-white/80 text-right">{item.subject}</span>
                                <div className="flex-1 h-2.5 bg-white/10 rounded-full overflow-hidden">
                                  <div 
                                    className={`h-full rounded-full ${item.A >= 90 ? 'bg-gradient-to-r from-yellow-400 to-orange-500' : 'bg-gradient-to-r from-blue-400 to-indigo-500'}`}
                                    style={{ width: `${item.A}%`, transition: 'width 1s ease-out' }}
                                  ></div>
                                </div>
                                <span className="w-8 text-[10px] font-bold text-white/60 text-right">{Math.round(item.A)}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="bg-white/5 rounded-3xl p-5 border border-white/10 flex-1">
                        <h3 className="text-xs font-bold text-white/60 mb-4 tracking-wider flex items-center gap-2">
                          <FileText size={14} /> 文字起こし ＆ フィードバック
                        </h3>
                        <div className="text-base leading-loose text-white/90">
                          {displayAiResult.transcript.map((part, idx) => {
                            if (part.type === 'normal') {
                              return <span key={idx}>{part.text}</span>;
                            }
                            
                            const colorClass = part.type === 'good' 
                              ? 'text-emerald-400 border-emerald-400/50 hover:bg-emerald-400/10' 
                              : 'text-orange-400 border-orange-400/50 hover:bg-orange-400/10';
                              
                            return (
                              <span 
                                key={idx} 
                                className={`relative group inline-block border-b-2 border-dashed cursor-help transition-colors px-1 mx-0.5 rounded ${colorClass}`}
                              >
                                {part.text}
                                <span className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max max-w-[200px] bg-slate-800 text-white text-xs p-2 rounded-lg shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">
                                  {part.feedback}
                                  <span className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></span>
                                </span>
                              </span>
                            );
                          })}
                        </div>
                        <div className="mt-6 text-center text-xs text-white/40">
                          ※ 色付きの文字をタップ(ホバー)すると厳しめのアドバイスが見れます
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <VoiceRecorder/>
      </ErrorBoundary>
    );
  </script>
</body>
</html>
